<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.container{
    width:90%;
    max-width:1100px;
    height:650px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* Left Side */

.left{
    width:50%;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:50px;
    text-align:center;
}

.left h1{
    font-size:42px;
    margin-bottom:20px;
}

.left p{
    line-height:28px;
    margin-bottom:40px;
}

.circle{
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:80px;
}

/* Right Side */

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8fafc;
}

.login-box{
    width:80%;
}

.login-box h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#666;
    margin-bottom:35px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:16px;
    transition:.3s;
}

.input-group input:focus{
    border-color:#2563eb;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#2563eb;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#888;
    font-size:14px;
}

@media(max-width:900px){

.container{
    flex-direction:column;
    height:auto;
}

.left,
.right{
    width:100%;
}

.left{
    padding:40px 20px;
}

.right{
    padding:40px 0;
}

.circle{
    width:160px;
    height:160px;
    font-size:60px;
}

}

</style>

</head>
<body>

<div class="container">

    <div class="left">

        <h1>Student Portal</h1>

        <p>
            Welcome to the Student Management System.<br>
            Access your attendance, profile, timetable,
            results and notices from one place.
        </p>

        <div class="circle">
            🎓
        </div>

    </div>

    <div class="right">

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p>Login to your account</p>

            <form action="dashboard.html">

                <div class="input-group">

                    <label>Student ID</label>

                    <input
                    type="text"
                    placeholder="Enter Student ID"
                    required>

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input
                    type="password"
                    placeholder="Enter Password"
                    required>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">

                    LOGIN

                </button>
                <div class="login-links">
    <a href="about.html">About Us</a>
    <span>|</span>
    <a href="help.html">Help</a>
</div>

            </form>

            <div class="footer">

                © 2026 Student Portal

            </div>

        </div>

    </div>

</div>

</body>
</html>
